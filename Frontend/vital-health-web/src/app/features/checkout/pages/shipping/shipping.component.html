<div class="checkout-page"><app-checkout-stepper [currentStep]="1"/><section><h1 class="section-title">Shipping Address</h1><p class="section-copy">Select a shipping address for this order.</p><div class="choice-grid">@for(address of checkout.addresses;track address.id){<button class="choice" [class.selected]="checkout.selectedAddressId()===address.id" (click)="checkout.selectedAddressId.set(address.id)"><input type="radio" [checked]="checkout.selectedAddressId()===address.id"/><span><strong>{{address.label}}</strong>@for(line of address.lines;track line){<small>{{line}}</small>}</span><b>Edit</b></button>}</div><button class="add-address">＋　Add New Address</button></section><section class="delivery"><h2 class="section-title">Delivery Method</h2><div class="delivery-list"><button class="choice" [class.selected]="checkout.deliveryMethod()==='standard'" (click)="checkout.deliveryMethod.set('standard')"><input type="radio" [checked]="checkout.deliveryMethod()==='standard'"/><i>▱</i><span><strong>Standard Shipping (Free)</strong><small>Estimated delivery: 3–5 business days</small></span></button><button class="choice" [class.selected]="checkout.deliveryMethod()==='expedited'" (click)="checkout.deliveryMethod.set('expedited')"><input type="radio" [checked]="checkout.deliveryMethod()==='expedited'"/><i>▱</i><span><strong>Expedited Shipping</strong><small>Estimated delivery: 1–2 business days</small></span><b>$15.00</b></button></div></section><div class="page-actions"><a class="back-link" routerLink="/checkout/cart">←　Back</a><a class="primary-action" routerLink="/checkout/payment">Continue to Payment　→</a></div></div>
