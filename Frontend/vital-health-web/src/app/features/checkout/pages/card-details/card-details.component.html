<div class="checkout-page narrow"><app-checkout-stepper [currentStep]="2"/><section class="checkout-card card-form"><h1>Card Information</h1><p class="secure">▣　Your payment information is secure and encrypted.</p><form [formGroup]="form" (ngSubmit)="submit()"><label>Cardholder Name<input formControlName="cardholderName"/></label><label>Card Number<div class="card-number"><input formControlName="cardNumber"/><span>VISA　●　AMEX</span></div></label><div class="form-row"><label>Expiration Date<input formControlName="expiry" placeholder="MM / YY"/></label><label>Security Code (CVV)<input formControlName="securityCode"/></label></div><label class="save"><input type="checkbox" formControlName="saveCard"/><span><strong>Save this card for future orders</strong><small>Your card will be securely tokenized. You can remove it anytime from your payment methods.</small></span></label></form></section><div class="page-actions"><a class="back-link" routerLink="/checkout/payment">←　Back</a><button class="primary-action" (click)="submit()">Continue to Review　→</button></div></div>
