<div class="stepper" aria-label="Signup progress">
  @for (step of [{ number: 1, label: 'Account Details' }, { number: 2, label: 'Professional Information' }, { number: 3, label: 'Verify Identity' }]; track step.number) {
    <div class="step" [class.active]="step.number === currentStep()" [class.complete]="step.number < currentStep()">
      <div class="step__track"><span>{{ step.number < currentStep() ? '✓' : step.number }}</span></div>
      <small>{{ step.label }}</small>
    </div>
  }
</div>
