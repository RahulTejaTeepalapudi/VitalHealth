version: 1

applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24.19.0
            - nvm use 24.19.0
            - node --version
            - npm --version
            - npm ci --cache .npm --prefer-offline

        build:
          commands:
            - npm run build

      artifacts:
        baseDirectory: dist/vital-health-web/browser
        files:
          - '**/*'

      cache:
        paths:
          - .npm/**/*

    appRoot: Frontend/vital-health-web